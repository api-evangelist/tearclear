aid: tearclear
name: Tearclear
description: >-
  TearClear Corp. is a clinical-stage ophthalmic pharmaceutical company founded in 2015 that
  develops a preservative-removing drug delivery platform: a chemical filter built into a
  conventional multi-dose eye-drop bottle that captures benzalkonium chloride (BAK) at the
  point of instillation, so the medication stays preserved in the bottle but reaches the
  ocular surface preservative-free. Its lead candidate TC-002 (latanoprost ophthalmic
  solution 0.005%) met the primary and all secondary endpoints in the CLEAR Phase 3 pivotal
  glaucoma trial, with TC-001 (timolol), TC-003 (brimonidine/timolol) and TC-004
  (brimonidine) behind it. TearClear ships drug products and delivery hardware, not
  software: it operates no developer program and publishes no API, SDK or machine-readable
  contract, and its own corporate domain no longer resolves to a served website.
